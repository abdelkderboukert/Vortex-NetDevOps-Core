name: Dynamic Feature Testing & Master Deploy

on:
  push:
    branches:
      - "master"
      - "devlop"

jobs:
  test-logic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run Dynamic Branch Test
        shell: bash
        run: |
          # Extract branch name (e.g., Feature1)
          BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/})

          # Run the specific test file: test-{branchname}.py
          echo "Running tests for branch: $BRANCH_NAME"
          pytest "test/test-$BRANCH_NAME.py" > test_results.txt

      - name: Upload Test Results
        if: always() # Upload even if tests fail so you can see why
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.ref_name }}
          path: test_results.txt

  build-and-push:
    needs: test-logic
    if: github.ref == 'refs/heads/master' # Only run this part on Master
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-python-app:latest
